<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <title>বউ হবে আমার</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bangla font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Noto Sans Bengali", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: url("https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    /* Dark gradient overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, rgba(255, 255, 255, 0.15), transparent 55%),
                  linear-gradient(135deg, rgba(255, 0, 120, 0.6), rgba(79, 70, 229, 0.8));
      mix-blend-mode: multiply;
      z-index: -1;
    }

    /* Floating flower particles (simple circles) */
    .floating {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .petal {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 999px 999px 999px 0;
      opacity: 0.35;
      background: rgba(255, 255, 255, 0.8);
      filter: blur(0.5px);
      animation: floatDown linear infinite;
    }

    .petal:nth-child(1) { left: 10%; animation-duration: 18s; animation-delay: -4s; transform: rotate(25deg); }
    .petal:nth-child(2) { left: 25%; animation-duration: 22s; animation-delay: -10s; transform: rotate(-10deg); }
    .petal:nth-child(3) { left: 40%; animation-duration: 16s; animation-delay: -2s; transform: rotate(15deg); }
    .petal:nth-child(4) { left: 55%; animation-duration: 20s; animation-delay: -8s; transform: rotate(-25deg); }
    .petal:nth-child(5) { left: 70%; animation-duration: 24s; animation-delay: -12s; transform: rotate(5deg); }
    .petal:nth-child(6) { left: 85%; animation-duration: 19s; animation-delay: -6s; transform: rotate(-15deg); }

    @keyframes floatDown {
      0%   { top: -10%; transform: translateX(0) rotate(0deg); }
      50%  { transform: translateX(20px) rotate(45deg); }
      100% { top: 110%; transform: translateX(-20px) rotate(90deg); }
    }

    .wrapper {
      max-width: 900px;
      width: 90%;
      padding: 32px;
    }

    .card {
      border-radius: 32px;
      padding: 40px 32px 32px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(248, 250, 252, 0.3);
      box-shadow:
        0 26px 60px rgba(15, 23, 42, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(22px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(244, 114, 182, 0.5), transparent 60%);
      top: -60px;
      right: -40px;
      opacity: 0.8;
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(129, 140, 248, 0.65), transparent 65%);
      bottom: -90px;
      left: -40px;
      opacity: 0.8;
      pointer-events: none;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(248, 250, 252, 0.08);
      border: 1px solid rgba(248, 250, 252, 0.25);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #f973c3;
      box-shadow: 0 0 8px rgba(244, 114, 182, 0.8);
    }

    h1 {
      font-size: clamp(3rem, 5vw, 4.6rem);
      line-height: 1.1;
      margin-bottom: 14px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #f9fafb;
      text-shadow:
        0 0 18px rgba(15, 23, 42, 0.9),
        0 0 40px rgba(248, 250, 252, 0.4);
    }

    .sub {
      font-size: 1rem;
      color: rgba(226, 232, 240, 0.9);
      max-width: 26rem;
      margin: 0 auto 22px;
    }

    .accent {
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.8rem;
      color: rgba(244, 114, 182, 0.95);
    }

    .btn-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .btn {
      position: relative;
      padding: 10px 22px;
      border-radius: 999px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      outline: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f973c3, #a855f7);
      color: #0b1020;
      box-shadow:
        0 10px 25px rgba(248, 113, 180, 0.55),
        0 0 0 1px rgba(248, 250, 252, 0.2);
    }

    .btn-primary:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow:
        0 16px 35px rgba(248, 113, 180, 0.7),
        0 0 0 1px rgba(248, 250, 252, 0.24);
    }

    .btn-ghost {
      background: rgba(15, 23, 42, 0.7);
      color: #e5e7eb;
      border: 1px solid rgba(248, 250, 252, 0.35);
      box-shadow:
        0 8px 22px rgba(15, 23, 42, 0.85),
        0 0 0 1px rgba(15, 23, 42, 0.8);
    }

    .btn-ghost:hover {
      background: rgba(15, 23, 42, 0.95);
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 18px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.24em;
      color: rgba(148, 163, 184, 0.8);
    }

    @media (max-width: 640px) {
      .card {
        padding: 28px 20px 24px;
      }
      h1 {
        letter-spacing: 0.03em;
      }
      .sub {
        font-size: 0.95rem;
      }
    }
    
    .card{
    border-radius: 32px;
    padding: 40px 32px 32px;
    background: rgb(255 0 92 / 68%);
    border: 1px solid rgba(248, 250, 252, 0.3);

: 0 26px 60px rgba(15, 23, 42, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02);
    backdrop-filter: blur(0px);
    text-align: center;
    position: relative;
    overflow: hidden;
}
  </style>
</head>
<body>

  <div class="floating">
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
  </div>

  <div class="wrapper">
    <div class="card">
      <div class="pill">
        <span class="pill-dot"></span>
        <span>To Baby Butterfly</span>
      </div>

      <h1>বউ হবে আমার</h1>

      <p class="sub">
        ফুলের সুগন্ধ, নরম আলো আর মিষ্টি ভibes এর মাঝে
        শুধু একটাই কথা — <span class="accent">বউ হবে আমার!</span>
      </p>



      <div class="footer">
       From Nayeem Islam
      </div>
    </div>
  </div>

</body>
</html>
